{% extends "base.html" %}

{% block content %}
<br>
<br>
<br>
<br>
<br>
    <div class="container">
        <h2>User Complaints</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Subject</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for complaint in complaints %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ complaint.subject }}</td>
                        <td>{{ complaint.get_status_display }}</td>
                        <td>{{ complaint.created_at }}</td>
                        <td><a href="{% url 'track_complaint' complaint.id %}">View Details</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
