{% extends 'base.html' %}
{% load static %}

{% block content %}
<br>
<br>
<br>
<br>

<!-- LOGIN SECTION -->
<div id="login-section" class="d-flex justify-content-center align-items-center">
    <div class="login-form">
		<a class="navbar-brand" href="{% url "index" %}">Smart<small>Eat</small></a>
<br>
        {% comment %} <h2 class="text-center">Sign In to <strong>SmartEat</strong></h2> {% endcomment %}
        <form method="POST"> 
            {% csrf_token %}
			{% include "messages.html" %}
            <div class="form-group">
                <input name="username" class="form-control" type="text" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input name="password" class="form-control" type="password" placeholder="Password" required>
            </div>
            <div class="text-center">
                <button class="btn btn-primary btn-block order-submit">Login</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <p>Don't have an account? <a href="{% url 'register' %}" class="text-primary">Sign up</a></p>
        </div>
    </div>
</div>

<style>
    /* Background Styling */
    #login-section {
        height: 100vh;
        background: url('{% static "images/bg.jpg" %}') no-repeat center center/cover;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Login Form */
    .login-form {
        background: rgba(255, 255, 255, 0.2); /* Transparent White */
        backdrop-filter: blur(10px); /* Blur Effect */
        padding: 30px;
        border-radius: 15px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
    }

    .form-control {
        background: rgba(255, 255, 255, 0.5);
        border: none;
        color: #333;
        padding: 12px;
        border-radius: 8px;
    }

    .form-control::placeholder {
        color: rgba(0, 0, 0, 0.6);
    }

    .order-submit {
        background: rgba(0, 123, 255, 0.8);
        border: none;
        padding: 12px;
        color: #fff;
        font-weight: bold;
        width: 100%;
        transition: 0.3s ease-in-out;
        border-radius: 8px;
    }

    .order-submit:hover {
        background: rgba(0, 123, 255, 1);
    }
</style>

{% endblock content %}
